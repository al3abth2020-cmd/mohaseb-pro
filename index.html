<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية | محاسب برو</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(circle at 30% 10%, #1a2150, #0f1226 60%);
    color: #fff; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px;
  }
  .logo { font-size: 46px; margin-bottom: 6px; }
  h1 { font-size: 26px; margin: 0 0 6px; text-align: center; }
  .sub { color: #9aa0c0; font-size: 14px; margin-bottom: 30px; text-align: center; }

  .menu { display: grid; gap: 16px; width: 100%; max-width: 420px; }
  .app {
    display: flex; align-items: center; gap: 16px; text-decoration: none; color: #fff;
    background: linear-gradient(145deg, #1d2148, #161a38);
    border: 2px solid #2a3060; border-radius: 20px; padding: 20px;
    transition: transform .1s, border-color .2s;
  }
  .app:active { transform: scale(.97); }
  .app.tiktok:hover { border-color: #6be3a3; }
  .app.mohaseb:hover { border-color: #4f8cff; }
  .app .icon {
    width: 62px; height: 62px; border-radius: 16px; flex: 0 0 62px;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .app.tiktok .icon  { background: linear-gradient(145deg,#199e5e,#12633c); }
  .app.mohaseb .icon { background: linear-gradient(145deg,#3a6ddc,#274a99); }
  .app .txt { flex: 1; }
  .app .txt .name { font-size: 19px; font-weight: 800; margin-bottom: 3px; }
  .app .txt .desc { font-size: 13px; color: #9aa0c0; line-height: 1.5; }
  .app .arrow { color: #5a6390; font-size: 22px; }

  .footer { margin-top: 34px; color: #5a6390; font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="logo">📊</div>
  <h1>محاسب برو</h1>
  <div class="sub">اختر التطبيق اللي تبي تفتحه</div>

  <div class="menu">
    <a class="app tiktok" href="tiktok.html">
      <div class="icon">🧮</div>
      <div class="txt">
        <div class="name">جرد تيك توك</div>
        <div class="desc">جرد سريع للعملات مع حساب التكلفة والرسوم بالدولار والريال والقطري</div>
      </div>
      <div class="arrow">‹</div>
    </a>

    <a class="app mohaseb" href="mohaseb.html">
      <div class="icon">📒</div>
      <div class="txt">
        <div class="name">نظام المحاسبة</div>
        <div class="desc">برنامج المحاسبة الكامل — الفواتير والحسابات والتقارير</div>
      </div>
      <div class="arrow">‹</div>
    </a>
  </div>

  <div class="footer">اضغط على أي تطبيق للدخول · تقدر ترجع للرئيسية في أي وقت</div>
</body>
</html>
